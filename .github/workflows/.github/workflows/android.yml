name: Build VibeRoom APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create --project-name viberroom --platforms android .
          
      - name: Restore VibeRoom main.dart
        run: |
          test -f lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build VibeRoom APK
        run: flutter build apk --release

      - name: Upload VibeRoom APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeRoom-APK
          path: build/app/outputs/flutter-apk/app-release.apk
